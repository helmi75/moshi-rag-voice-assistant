services:
  api:
    build:
      context: ./api
    # Remonte seule après un reboot du serveur (indispensable pour un service 24/7).
    restart: unless-stopped
    ports:
      # N'écouter QUE sur la boucle locale. Caddy joint l'API par le réseau Docker
      # (`reverse_proxy api:8000`, cf. caddy/Caddyfile) : publier 8000 sur 0.0.0.0
      # n'apportait rien et ouvrait une seconde porte d'entrée en HTTP nu, hors TLS
      # et hors Caddy — /admin y était joignable en clair. On garde le port sur
      # 127.0.0.1 pour le diagnostic local (`curl localhost:8000/health`).
      - "127.0.0.1:8000:8000"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      LLM_MODEL: "${LLM_MODEL:-openrouter/free}"
      # Raisonnement du LLM. « off » (défaut) : Gemini 2.5 répond sans réfléchir en
      # amont — au téléphone cette réflexion est du silence (2,6 s contre 0,6 s mesurés
      # sur un appel d'outil). « on » le réactive si un cas complexe le justifie.
      LLM_REASONING: "${LLM_REASONING:-off}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_NUMBER: "${TWILIO_NUMBER}"
      # Restaurant de démonstration semé dans une base VIDE (numéro = TWILIO_NUMBER).
      # Il n'est plus jamais réaligné ensuite : l'admin fait foi. 0 = ne rien semer.
      SEED_DEMO: "${SEED_DEMO:-1}"
      # Signature des requêtes Twilio (X-Twilio-Signature). PUBLIC_URL = l'origine publique
      # exacte configurée dans la console (https://app.exemple.fr) ; vide, elle est dérivée
      # de PUBLIC_WS_URL. TWILIO_SIGNATURE : enforce (défaut dès qu'un jeton existe),
      # log (observer 48 h après un déploiement : compte sans refuser), off (dev local).
      PUBLIC_URL: "${PUBLIC_URL:-}"
      TWILIO_SIGNATURE: "${TWILIO_SIGNATURE:-}"
      DB_PATH: "/app/data/app.db"
      # URL publique du flux média annoncée à Twilio (wss://<domaine>/ws/voice). Exigée
      # par la supervision : sans elle, l'appel raccroche sans un mot.
      PUBLIC_WS_URL: "${PUBLIC_WS_URL:-}"
      # Naturalité de la conversation (fin de tour / barge-in). Baisser USER_TURN_STOP_TIMEOUT
      # = reprise plus vive quand smart-turn hésite ; monter VAD_CONFIDENCE = moins de faux
      # départs sur le bruit ; VAD_STOP_SECS = tolérance aux pauses courtes en milieu de phrase.
      USER_TURN_STOP_TIMEOUT: "${USER_TURN_STOP_TIMEOUT:-2.0}"
      VAD_CONFIDENCE: "${VAD_CONFIDENCE:-0.85}"
      VAD_START_SECS: "${VAD_START_SECS:-0.2}"
      VAD_STOP_SECS: "${VAD_STOP_SECS:-0.5}"
      # Ce qui coupe la parole à l'assistante. « mots » (défaut projet) = uniquement
      # une vraie transcription. « voix » (défaut Pipecat) = tout son, y compris un
      # souffle : la phrase est tranchée et rien ne repart, le client dit « allô ».
      INTERRUPTION: "${INTERRUPTION:-mots}"
      # Transcription : Deepgram nova-3 en flux — le seul moteur STT depuis le 18/09/2026.
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      # Modèle Deepgram. nova-3 = défaut (bien meilleur sur les noms propres au
      # téléphone). Il utilise `keyterm` au lieu de `keywords` — bot.py bascule tout
      # seul. DEEPGRAM_LANGUAGE vide (défaut) : décroché en `multi`, puis voice/langue.py
      # fixe la langue de l'appel ; « fr » ou « en » l'impose pour tout l'appel.
      DEEPGRAM_MODEL: "${DEEPGRAM_MODEL:-nova-3}"
      DEEPGRAM_LANGUAGE: "${DEEPGRAM_LANGUAGE:-}"
      DEEPGRAM_KEYWORDS: "${DEEPGRAM_KEYWORDS:-}"
      # Voix : le serveur Rust moshi-server sur Modal — le seul moteur TTS depuis le
      # 18/09/2026. URL wss, clé (défaut public_token jusqu'à la rotation prévue) et
      # voix par défaut du parc.
      MOSHI_TTS_URL: "${MOSHI_TTS_URL:-}"
      MOSHI_TTS_API_KEY: "${MOSHI_TTS_API_KEY:-public_token}"
      # Voix par défaut du parc. Chaque établissement peut choisir la sienne dans
      # l'admin (colonne tenants.voice) ; ce réglage ne sert qu'à ceux qui n'ont rien
      # choisi. Une valeur hors catalogue (api/app/voice/voices.py) est ignorée.
      MOSHI_TTS_VOICE: "${MOSHI_TTS_VOICE:-unmute-prod-website/developpeuse-3.wav}"
      # Notifications au restaurateur par e-mail (réservations, messages pris) : SMTP
      # générique. Sans SMTP_HOST, rien ne part et rien ne casse. SMTP_SSL=1 pour un port
      # 465 (TLS implicite) ; sinon STARTTLS sur 587.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SSL: "${SMTP_SSL:-0}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10}"
      # Plateforme admin : compte super-admin semé au 1er démarrage + secret de session.
      # Sans ADMIN_PASSWORD, l'admin est inaccessible (l'app vocale n'est pas affectée).
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@local}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_SECURE: "${SESSION_SECURE:-}"
      # Supervision (#24). ⚠️ Une variable posée dans `.env` n'atteint PAS le conteneur :
      # Compose s'en sert pour la substitution, pas pour peupler l'environnement du
      # service. Elle doit donc figurer ICI aussi. Vécu le 24/08 : le jeton était dans le
      # `.env` du VPS, la sonde répondait 404, et rien n'était surveillé.
      # Sans SUPERVISION_TOKEN, /supervision répond 404 — délibérément.
      SUPERVISION_TOKEN: "${SUPERVISION_TOKEN:-}"
      SUPERVISION_FENETRE_JOURS: "${SUPERVISION_FENETRE_JOURS:-7}"
      SUPERVISION_MUET_SECONDES: "${SUPERVISION_MUET_SECONDES:-15}"
      SUPERVISION_INACHEVE_MINUTES: "${SUPERVISION_INACHEVE_MINUTES:-30}"
      SUPERVISION_LATENCE_ATTENTION_MS: "${SUPERVISION_LATENCE_ATTENTION_MS:-2500}"
      SUPERVISION_LATENCE_PANNE_MS: "${SUPERVISION_LATENCE_PANNE_MS:-4000}"
      SUPERVISION_SAUVEGARDE_ATTENTION_H: "${SUPERVISION_SAUVEGARDE_ATTENTION_H:-36}"
      SUPERVISION_SAUVEGARDE_PANNE_H: "${SUPERVISION_SAUVEGARDE_PANNE_H:-72}"
      SUPERVISION_TWILIO_SECONDES: "${SUPERVISION_TWILIO_SECONDES:-900}"
      SUPERVISION_BACKUP_STAMP: "${SUPERVISION_BACKUP_STAMP:-/app/data/derniere-sauvegarde}"
      # Données personnelles (#22). Mêmes règles que ci-dessus : une variable posée dans
      # `.env` n'atteint pas le conteneur si elle ne figure pas ICI.
      RETENTION_TRANSCRIPT_JOURS: "${RETENTION_TRANSCRIPT_JOURS:-30}"
      RETENTION_NUMERO_JOURS: "${RETENTION_NUMERO_JOURS:-90}"
      RETENTION_RESERVATION_JOURS: "${RETENTION_RESERVATION_JOURS:-365}"
      RETENTION_INTERVALLE_SECONDES: "${RETENTION_INTERVALLE_SECONDES:-86400}"
      RGPD_MENTION: "${RGPD_MENTION:-1}"
      # Enregistrement des appels (#88). Défaut 0 : la fonctionnalité s'allume
      # explicitement. L'activer change la mention entendue au décroché, donc la clé de
      # cache des accueils — tous les WAV sont re-rendus au démarrage suivant.
      ENREGISTREMENT_APPELS: "${ENREGISTREMENT_APPELS:-0}"
      ENREGISTREMENT_DIR: "${ENREGISTREMENT_DIR:-/app/data/enregistrements}"
      ENREGISTREMENT_MAX_SECONDES: "${ENREGISTREMENT_MAX_SECONDES:-900}"
      ENREGISTREMENT_DISQUE_MINIMUM_MO: "${ENREGISTREMENT_DISQUE_MINIMUM_MO:-2000}"
      RETENTION_ENREGISTREMENT_JOURS: "${RETENTION_ENREGISTREMENT_JOURS:-30}"
      JOURNAL_MAX_TOURS: "${JOURNAL_MAX_TOURS:-100}"
      JOURNAL_MAX_EVENEMENTS: "${JOURNAL_MAX_EVENEMENTS:-400}"
      SUPERVISION_DISQUE_ATTENTION_MO: "${SUPERVISION_DISQUE_ATTENTION_MO:-10000}"
      SUPERVISION_DISQUE_PANNE_MO: "${SUPERVISION_DISQUE_PANNE_MO:-2000}"
      # Réglages fins, transmis TELS QUELS : sans valeur ici, Compose prend celle du .env
      # si elle y est, et sinon la variable n'existe pas dans le conteneur — c'est alors
      # le défaut écrit dans le code qui s'applique, une seule source de vérité. Avant le
      # 19/09/2026 ils n'étaient pas listés : posés dans le .env (env.example en documente
      # plusieurs), ils n'avaient AUCUN effet. Un test exige que toute variable lue par
      # l'application figure dans ce fichier (test_supervision.py::TestCablage).
      #  - GPU chaud : MOSHI_KEEPWARM_SECONDS (90 = actif, ≈ 0,80 $/h de GPU) et
      #    MOSHI_KEEPWARM_HEURES (« 11:30-14:30,18:30-23 », heure du restaurant).
      MOSHI_KEEPWARM_SECONDS:
      MOSHI_KEEPWARM_HEURES:
      MOSHI_CHAUD_SECONDES:
      MOSHI_HOLD_AFTER_SECONDS:
      MOSHI_HOLD_MAX_SECONDS:
      MOSHI_HOLD_MUSIC_PATH:
      MOSHI_RESUME_TEXT:
      MOSHI_RESUME_TEXT_CHAUD:
      MOSHI_TTS_OPEN_TIMEOUT:
      MOSHI_WARMUP_TEXT:
      GREETING_CACHE_DIR:
      HOLD_MUSIC_DIR:
      REPONSE_ANTICIPEE:
      USER_IDLE_TIMEOUT:
      RESTAURANT_TIMEZONE:
      OPENROUTER_APP_NAME:
      OPENROUTER_SITE_URL:
      COST_TWILIO_PER_MIN:
      COST_DEEPGRAM_PER_MIN:
      COST_MODAL_PER_MIN:
      COST_LLM_PER_CALL:
      LOGIN_MAX_ECHECS:
      LOGIN_FENETRE_SECONDES:
      DB_SYNCHRONOUS:
    volumes:
      - api_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # ":80" en local (HTTP simple) ; un ou plusieurs domaines en prod (séparés par des
      # virgules) -> Caddy fait le HTTPS Let's Encrypt tout seul. Plusieurs noms servent
      # à basculer de domaine sans coupure. Cf. caddy/Caddyfile et docs/DEPLOY.md.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      # Noms qui redirigent (301) vers SITE_CANONICAL — domaine racine, www, autres
      # extensions. Chacun doit pointer sur ce serveur, sinon Caddy ne peut pas obtenir
      # son certificat. Défaut ":81" = port non publié, donc bloc inoffensif en dev.
      SITE_REDIRECTS: "${SITE_REDIRECTS:-:81}"
      SITE_CANONICAL: "${SITE_CANONICAL:-http://localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Le DOSSIER, pas le fichier. Un montage de fichier unique fige l'inode : quand
      # `git reset --hard` remplace le Caddyfile, le conteneur continue de lire
      # l'ancien contenu, et un `caddy reload` recharge… l'ancienne configuration.
      # Vécu le 23/08 : les en-têtes de sécurité ont été « déployés » sans effet, et
      # le déploiement s'est déclaré réussi.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  api_data:
  caddy_data:
  caddy_config:
