name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Aucun droit par défaut (ASSISTANTE-178) : sans cette ligne, le jeton de chaque job reçoit
# ce que règle le dépôt, peut-être l'écriture partout. Chaque job dit ce dont il a besoin.
permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/app/requirements.lock
            api/tests/requirements-test.txt

      # libgomp1 : onnxruntime (VAD Silero / smart-turn).
      - name: Dépendances système
        run: sudo apt-get update -q && sudo apt-get install -y -q libgomp1

      - name: Dépendances Python
        run: |
          pip install --upgrade pip
          # Le VERROU, comme l'image Docker : la CI teste ce qui sera déployé, pas « la
          # dernière version » de chaque paquet.
          pip install -r api/app/requirements.lock -r api/tests/requirements-test.txt

      # Défauts que les tests ne voient que si la branche est empruntée : nom non défini,
      # import inutile ; et, depuis ASSISTANTE-171, les règles de Bandit (S) et de bugbear
      # (B). Règles dans ruff.toml ; version figée, comme le reste.
      - name: Analyse statique (ruff)
        run: |
          pip install ruff==0.13.0
          ruff check api/app

      # Vulnérabilités connues dans les versions VERROUILLÉES (ce qui part en production).
      # Bloquant depuis ASSISTANTE-177 : un avis se corrige (montée du paquet dans le verrou)
      # ou s'accepte par écrit dans .github/pip-audit-exceptions.txt, avec sa raison et la
      # version qu'il vise. Version de pip-audit figée, comme le reste.
      - name: Audit des dépendances (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^/--ignore-vuln /' \
            .github/pip-audit-exceptions.txt | xargs pip-audit -r api/app/requirements.lock \
            --no-deps --disable-pip

      - name: Tests (aucun réseau, tout mocké)
        working-directory: api
        run: python -m pytest tests -q

      # Un test vert ne prouve rien s'il resterait vert une fois la protection retirée.
      # Ce contrôle retire chaque garde-fou critique et exige que les tests rougissent.
      - name: Les garde-fous mordent-ils vraiment ?
        env:
          CI: "true"
        run: python3 scripts/mutation_check.py --runner native

      # Un second regard, d'un autre moteur : Semgrep lit aussi les gabarits Jinja (une
      # variable dans un href, un attribut sans guillemets), que ruff ne voit pas. Bandit
      # n'est pas ajouté : les règles S de ruff en sont le portage, et sur ce code il ne
      # trouvait rien de plus (mesuré le 24/10/2026). Version figée, dans son propre
      # environnement (ses dépendances ne doivent pas toucher celles qu'on teste). Les
      # règles viennent du registre de Semgrep et peuvent s'enrichir : une nouvelle alerte
      # se corrige, ou se justifie sur sa ligne (`nosemgrep: règle — pourquoi`).
      # Seule une alerte bloque (code 1, mesuré). Registre injoignable (2) ou règle
      # introuvable (7) : un avertissement, pas un rouge — une panne chez Semgrep ne doit
      # pas retenir un correctif urgent, puisque le déploiement exige une CI verte.
      # En dernier : un rouge ici laisse voir le résultat des tests.
      - name: Analyse de sécurité (Semgrep)
        run: |
          python -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install -q semgrep==1.180.0
          code=0
          /tmp/semgrep/bin/semgrep scan --metrics=off --error --quiet \
            --config p/python --config p/security-audit api/app scripts || code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Semgrep n'a pas pu analyser (code $code : registre injoignable ?). À relancer."
          fi

  # L'image de production est construite ICI, depuis le commit que les tests viennent de
  # valider, et nulle part ailleurs (ASSISTANTE-167). Le serveur la télécharge et la lance :
  # il ne construit plus rien. Avant, `docker compose up --build` sur le serveur
  # reconstruisait l'image à chaque déploiement, à partir d'un environnement que la CI
  # n'avait jamais vu.
  # Sur une branche, l'image est construite et éprouvée sans être publiée : la PR prouve
  # que le job tient avant d'atteindre `main`.
  image:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `packages: write` sert aussi sur les branches, où rien n'est publié : un droit ne
    # dépend pas d'une condition ; il faudrait un job de publication de plus, réservé à main,
    # qui reconstruirait l'image depuis le cache. Laissé (ASSISTANTE-178) : seul quelqu'un qui
    # peut déjà modifier ce fichier pousse une branche, une PR venue d'un fork ne lance pas ce
    # job (`push` seulement), et les actions qui reçoivent le jeton sont épinglées.
    permissions:
      contents: read
      packages: write
    env:
      # Marquée par l'empreinte complète du commit : c'est elle que scripts/deploy.sh
      # demande, jamais une étiquette qui bouge (`latest`).
      IMAGE: ghcr.io/helmi75/moshi-rag-voice-assistant:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./api
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qui ne démarre pas ne doit pas exister au registre : sans aucune clé,
      # l'application démarre et répond sur /health (mesuré : environ 30 s).
      - name: L'image démarre-t-elle ?
        run: |
          docker run -d --name essai -p 127.0.0.1:18000:8000 \
            -e SEED_DEMO=0 -e DB_PATH=/tmp/app.db "$IMAGE"
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:18000/health; then
              echo "santé 200 après $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          docker logs essai | tail -40
          exit 1

      - name: Publication sur GHCR
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
